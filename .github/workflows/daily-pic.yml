name: Daily Pic

on:
  schedule:
    # 北京时间每天 12:30（GitHub cron 为 UTC，04:30 = 北京 12:30）
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅试跑（抓图+打分日志，不推送不落盘）"
        required: false
        default: "false"

permissions:
  contents: write   # 回写图片去重历史 output/pic_history.json

concurrency:
  group: daily-pic-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  push-pic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Fetch images and push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/daily_pic.py --dry-run
          else
            python scripts/daily_pic.py
          fi

      - name: Commit picture history
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pic_history.json
          if git diff --cached --quiet; then
            echo "no history changes"
          else
            git commit -m "chore(pic): 更新每日美图去重历史"
            git push
          fi
