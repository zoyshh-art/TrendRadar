name: Phone Deal Watch

on:
  schedule:
    # 每 30 分钟巡检一次（北京时间 X:07 / X:37，避开整点拥堵）
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 回写好价去重历史 output/phone_deal_history.json

concurrency:
  group: phone-deal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check new deals and push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/phone_deal.py

      - name: Commit deal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/phone_deal_history.json
          if git diff --cached --quiet; then
            echo "no history changes"
          else
            git commit -m "chore(deal): 更新手机好价去重历史"
            git push
          fi
