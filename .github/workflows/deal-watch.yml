name: Phone Deal Watch

on:
  schedule:
    # GitHub 官方下限为 5 分钟/cron 表达式；这里布 3 条错峰 cron
    # （每条自身间隔均 ≥5 分钟），合计每半小时 12 个触发点 → 平均约 2.5 分钟一轮
    - cron: "2-59/5 * * * *"            # 2,7,12,17,22,27,32,37,42,47,52,57
    - cron: "0,10,20,30,40,50 * * * *"  # 0,10,20,30,40,50
    - cron: "5,15,25,35,45,55 * * * *"  # 5,15,25,35,45,55
  workflow_dispatch:

permissions:
  contents: write   # 回写好价状态 output/phone_deal_state.json（同价3次/30分钟节流账本）

concurrency:
  group: phone-deal-${{ github.ref_name }}
  # 不取消进行中的运行：正在推送的历史不能被杀掉
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check new deals and push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/phone_deal.py

      - name: Commit deal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/phone_deal_state.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore(deal): 更新手机好价节流状态"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              echo "push retry $i"
              sleep 5
            done
          fi
