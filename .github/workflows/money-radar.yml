name: Money Radar

on:
  schedule:
    # 北京时间每天 09:00（UTC 01:00）
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 回写机会去重状态 output/money_radar_state.json

concurrency:
  group: money-radar-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests -q

      - name: Scan money opportunities and push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/money_radar.py

      - name: Commit dedup state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/money_radar_state.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore(money): 更新每日机会去重状态"
            # 好价巡检每 5 分钟回写 state，可能撞车 → rebase 重试
            for i in 1 2 3; do
              git pull --rebase origin master && git push && exit 0
              sleep 5
            done
            exit 1
          fi